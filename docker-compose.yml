services:
  vinted-hub:
    build: .
    container_name: vinted-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # one line per variable from the repo's .env.example
      # format:  NAME: ${NAME}
      EXAMPLE_KEY: ${EXAMPLE_KEY}
      TZ: America/Indianapolis
    volumes:
      - vinted-data:/srv/vinted-hub/data

volumes:
  vinted-data:
