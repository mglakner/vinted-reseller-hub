services:
  vinted-hub:
    build: .
    container_name: vinted-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_PASSWORD=change-me
      SECRET_KEY=change-me
      VINTED_DOMAIN=www.vinted.com
      CURRENCY=USD
      TZ=America/Indianapolis
    volumes:
      - vinted-data:/srv/vinted-hub/data

volumes:
  vinted-data:
