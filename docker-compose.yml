services:
  vinted-hub:
    build: .
    container_name: vinted-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_PASSWORD=${APP_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - VINTED_DOMAIN=www.vinted.com
      - CURRENCY=USD
      - TZ=America/Indianapolis
    volumes:
      - vinted-data:/srv/vinted-hub/data

volumes:
  vinted-data:
