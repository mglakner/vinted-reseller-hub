{% extends "base.html" %}
{% block title %}New item — Vinted Hub{% endblock %}
{% block content %}
<section class="card">
  <h2>📸 New item</h2>
  <form method="post" action="/items/new" enctype="multipart/form-data" class="stack">
    <label class="photo-drop">
      <input type="file" name="photos" accept="image/*" multiple
             onchange="this.closest('label').querySelector('span').textContent = this.files.length + ' photo(s) selected'">
      <span>📷 Choose from gallery or take a photo</span>
    </label>
    <label>Item <input name="name" required placeholder="e.g. Wool sweater - blue - size M"></label>
    <div class="row2">
      <label>Brand <input name="brand" placeholder="e.g. Lacoste"></label>
      <label>Purchase price <input name="purchase_price" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
    </div>
    <div class="row2">
      <label>Category
        <select name="category">
          <option>Menswear</option><option>Womenswear</option><option>Shoes</option>
          <option>Bags</option><option>Accessories</option><option>Homeware</option>
          <option>Electronics</option><option>Other</option>
        </select>
      </label>
      <label>Condition
        <select name="condition">
          <option>Good condition</option><option>Used - good</option><option>New with tags</option><option>Worn</option>
        </select>
      </label>
    </div>
    <div class="row2">
      <label>Date bought <input name="purchase_date" type="date" value="{{ today }}"></label>
      <label>Expected sale price <input name="expected_price" type="number" step="1" min="0" inputmode="decimal"></label>
    </div>
    <button type="submit" class="button big">Save item</button>
  </form>
</section>
{% endblock %}
